[project]
name = "hidden-shelf"
version = "0.1.15"
description = "Hidden Shelf（藏片阁）：本地番号片整理器，归位文件并在盘根目录生成纯静态站"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "jinja2>=3.1",
]

[project.scripts]
shelf = "hidden_shelf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hidden_shelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
