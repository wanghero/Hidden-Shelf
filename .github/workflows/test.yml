# 三平台跑全部测试：Python（pytest，依赖系统 ffmpeg，缺则部分 skip）与前端纯逻辑（node --test）。
# 测试永不联网（tests/conftest.py 的 isolated_home 把全局配置落到临时目录并停用全部来源），CI 里也不许联网。
# Windows 这一路允许失败（continue-on-error）：作者没有 Windows 机器，只在 macOS 验证过，
# 先看 CI 的结果再决定修什么；等它稳定了再把这一行去掉。
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # ffmpeg 尽量用各平台自己的包管理器装：setup-ffmpeg@v3 只有 x64 包（macos-latest 已是 arm64，报
      # 「Unsupported architecture」），而且每次都去外网读静态构建的 readme，读不到就整个 job 挂
      # （「Failed to read version from readme」，2026-10-30 ubuntu 撞到过一次）。只剩 Windows 还用它。
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: node --test "tests/js/**/*.test.mjs"
